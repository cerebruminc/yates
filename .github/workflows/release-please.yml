on:
  push:
    branches:
      - master
      - 4.x
  workflow_dispatch:

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      CEREBRUM_NPM_TOKEN: ${{ secrets.CEREBRUM_NPM_TOKEN }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.GHA_NODEJS_TOKEN }}
      # The logic below handles the npm publication:
      - uses: actions/checkout@v6
        # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.release_created }}
      - run: npm i
        if: ${{ steps.release.outputs.release_created }}
      - name: Publish latest release
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.CEREBRUM_PUBLISH_NPM_TOKEN}}
        if: ${{ steps.release.outputs.release_created && github.ref_name == 'master' }}
      - name: Publish v4 maintenance release
        run: npm publish --access public --tag v4
        env:
          NODE_AUTH_TOKEN: ${{secrets.CEREBRUM_PUBLISH_NPM_TOKEN}}
        if: ${{ steps.release.outputs.release_created && github.ref_name == '4.x' }}
